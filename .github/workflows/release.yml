name: Publish 1pass Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.11.0
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
concurrency:
  group: onepass-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || 'v1.11.0' }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.13.1
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v1.11.0' }}
        run: node --input-type=module -e 'import fs from "node:fs";const p=JSON.parse(fs.readFileSync("package.json","utf8"));if(process.env.RELEASE_TAG!=="v"+p.version)throw new Error("tag/version mismatch")'
      - name: Install dependencies without package hooks
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check build and test
        run: |
          pnpm typecheck
          pnpm build
          pnpm test
          pnpm scan:secrets
          pnpm scan:dead
      - name: Package verified build
        run: |
          npm pack --ignore-scripts
          sha256sum dsh-vault-*.tgz > release.sha256.txt
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || 'v1.11.0' }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG — 密码管理(1pass) 工作台与加密云备份" --notes-file docs/release-v1.11.0.md
          fi
          gh release upload "$RELEASE_TAG" dsh-vault-*.tgz release.sha256.txt --clobber
